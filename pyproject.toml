[project]
name = "evalkit"
version = "0.1.0"
description = "Golden-dataset regression evaluation for rule-based LLM judges, with a CI gate and a results UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.80",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
evalkit = "evalkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
